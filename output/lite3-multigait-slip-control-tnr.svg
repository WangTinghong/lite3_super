<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1160" viewBox="0 0 1920 1160" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">Lite3 多步态协同与湿滑风险自适应控制架构</title>
  <desc id="fig-desc">在现有 Lite3 DreamWaQ 和楼梯运动基线上，复用滑移风险估计闭环，新增风险感知速度与步态监督器、共享步态条件策略、仿真监督训练及分级工程验证。</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3569A8"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#13877F"/></marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#788795"/></marker>
    <style>
      text { font-family: "Times New Roman", "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", serif; fill: #183246; }
      .title { font-size: 39px; font-weight: 700; fill: #102A40; }
      .subtitle { font-size: 19px; fill: #536B7C; }
      .section { font-size: 23px; font-weight: 700; fill: #173A55; }
      .box-title { font-size: 20px; font-weight: 700; }
      .body { font-size: 17px; }
      .small { font-size: 15px; }
      .tiny { font-size: 13px; }
      .formula { font-size: 17px; font-style: italic; }
      .blue-box { fill: #F1F6FB; stroke: #3569A8; stroke-width: 2.5; }
      .teal-box { fill: #EFF8F6; stroke: #13877F; stroke-width: 2.5; stroke-dasharray: 9 6; }
      .neutral-box { fill: #FFFFFF; stroke: #93A4B1; stroke-width: 1.8; }
      .train-box { fill: #FFF7E8; stroke: #D3942D; stroke-width: 2.2; stroke-dasharray: 8 5; }
      .flow-blue { fill: none; stroke: #3569A8; stroke-width: 3; marker-end: url(#arrow-blue); }
      .flow-teal { fill: none; stroke: #13877F; stroke-width: 3; marker-end: url(#arrow-teal); }
      .flow-gray { fill: none; stroke: #788795; stroke-width: 2.5; marker-end: url(#arrow-gray); }
    </style>
  </defs>

  <rect width="1920" height="1160" fill="#FFFFFF"/>
  <text class="title" x="64" y="62">Lite3 多步态协同与湿滑风险自适应控制</text>
  <text class="subtitle" x="66" y="105">保留现有 DreamWaQ / 楼梯能力：新增风险驱动的步态调度、速度约束与相位连续切换</text>

  <g aria-label="图例">
    <line x1="1110" y1="106" x2="1155" y2="106" stroke="#3569A8" stroke-width="4"/>
    <text class="small" x="1165" y="111">项目已有链路</text>
    <line x1="1300" y1="106" x2="1345" y2="106" stroke="#13877F" stroke-width="4" stroke-dasharray="9 6"/>
    <text class="small" x="1355" y="111">建议新增模块</text>
    <line x1="1510" y1="106" x2="1555" y2="106" stroke="#D3942D" stroke-width="4" stroke-dasharray="8 5"/>
    <text class="small" x="1565" y="111">仿真训练特权量</text>
  </g>
  <line x1="64" y1="139" x2="1856" y2="139" stroke="#D9E2E8" stroke-width="2"/>

  <text class="section" x="64" y="184">A. 在线推理：复用滑移风险闭环，新增风险感知步态编排</text>

  <!-- Online adaptive gait and wet-slip control path -->
  <rect class="blue-box" x="64" y="220" width="240" height="192" rx="16"/>
  <text class="box-title" x="84" y="254">巡检任务与速度指令</text>
  <text class="formula" x="84" y="290">u<tspan baseline-shift="sub" font-size="12">cmd</tspan> = (v<tspan baseline-shift="sub" font-size="12">x</tspan>, v<tspan baseline-shift="sub" font-size="12">y</tspan>, ω<tspan baseline-shift="sub" font-size="12">z</tspan>)</text>
  <text class="body" x="84" y="322">巡检目标 / 航向 / 速度</text>
  <text class="small" x="84" y="354">可选：路线或台阶提示</text>
  <text class="tiny" x="84" y="384" fill="#536B7C">任务层发指令，不直接给关节动作</text>

  <rect class="teal-box" x="340" y="220" width="290" height="192" rx="16"/>
  <text class="box-title" x="360" y="254" fill="#0D706B">本体状态与滑移风险</text>
  <text class="body" x="360" y="288">obs 45D + hist (5 × 45) → VAE</text>
  <text class="body" x="360" y="319">z(16) + 速度估计 v̂(3)</text>
  <text class="formula" x="360" y="351">p<tspan baseline-shift="sub" font-size="12">slip</tspan> = P(支撑足发生滑移)</text>
  <text class="small" x="360" y="382">复用湿滑方案：部署仅依赖本体时序</text>

  <rect class="teal-box" x="675" y="220" width="290" height="192" rx="16"/>
  <text class="box-title" x="695" y="254" fill="#0D706B">风险感知速度 / 步态监督器</text>
  <text class="formula" x="695" y="289">u<tspan baseline-shift="sub" font-size="12">safe</tspan> = α(p<tspan baseline-shift="sub" font-size="12">slip</tspan>) · u<tspan baseline-shift="sub" font-size="12">cmd</tspan></text>
  <text class="body" x="695" y="320">稳定干地：Trot（高效）</text>
  <text class="body" x="695" y="350">台阶提示：Stair-Step（抬脚）</text>
  <text class="body" x="695" y="380">风险升高：Walk/Crawl（高占空比）</text>
  <text class="tiny" x="695" y="401" fill="#0D706B">滞回阈值 + 最小驻留 + 周期边界渐变</text>

  <rect class="blue-box" x="1000" y="205" width="395" height="207" rx="16"/>
  <text class="box-title" x="1020" y="239">共享 DreamWaQ + 步态条件输入</text>
  <rect x="1020" y="257" width="190" height="78" rx="11" fill="#E6EFF8" stroke="#8AA9C8" stroke-width="1.5"/>
  <text class="small" x="1034" y="281" font-weight="700">现有状态表征</text>
  <text class="small" x="1034" y="306">45 + 16 + 3 = 64D</text>
  <text class="tiny" x="1034" y="326">obs + VAE + v̂</text>
  <rect x="1220" y="257" width="155" height="78" rx="11" fill="#EFF8F6" stroke="#13877F" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text class="small" x="1234" y="281" font-weight="700" fill="#0D706B">新增 e<tspan baseline-shift="sub" font-size="10">gait</tspan></text>
  <text class="small" x="1234" y="306">模式 + 频率</text>
  <text class="small" x="1234" y="326">占空比 / 相位</text>
  <path class="flow-teal" d="M 1210 296 L 1220 296"/>
  <text class="small" x="1020" y="365">Actor 输入：64D + e<tspan baseline-shift="sub" font-size="10">gait</tspan></text>
  <text class="small" x="1020" y="391">输出 12D 关节动作；保留现有动作接口</text>

  <rect class="blue-box" x="1430" y="220" width="180" height="192" rx="16"/>
  <text class="box-title" x="1450" y="254">PD 关节控制</text>
  <text class="formula" x="1450" y="290">q<tspan baseline-shift="sub" font-size="12">ref</tspan> = q<tspan baseline-shift="sub" font-size="12">0</tspan> + 0.25a</text>
  <text class="body" x="1450" y="323">Kp = 20</text>
  <text class="body" x="1450" y="352">Kd = 0.7</text>
  <text class="small" x="1450" y="383">12 DoF · 降采样 4</text>

  <rect class="blue-box" x="1640" y="220" width="216" height="192" rx="16"/>
  <text class="box-title" x="1660" y="254">Lite3 户外巡检</text>
  <image x="1671" y="229" width="154" height="154" href="lite3-slip-adaptation-robot.png" preserveAspectRatio="xMidYMid meet" aria-label="Lite3 四足机器人实物图"/>
  <rect x="1660" y="378" width="58" height="9" rx="3" fill="#B8C9D5"/>
  <rect x="1718" y="378" width="60" height="9" rx="3" fill="#84C9C2"/>
  <rect x="1778" y="378" width="58" height="9" rx="3" fill="#B8C9D5"/>
  <text class="tiny" x="1660" y="405">干地</text><text class="tiny" x="1722" y="405" fill="#0D706B">湿滑斑块</text><text class="tiny" x="1798" y="405">楼梯</text>

  <path class="flow-blue" d="M 304 316 L 340 316"/>
  <path class="flow-teal" d="M 630 316 L 675 316"/>
  <path class="flow-teal" d="M 965 316 L 1000 316"/>
  <path class="flow-blue" d="M 1395 316 L 1430 316"/>
  <path class="flow-blue" d="M 1610 316 L 1640 316"/>

  <!-- Proprioceptive feedback reuses the preceding wet-slip loop -->
  <path d="M 1748 412 L 1748 446 L 485 446 L 485 412" fill="none" stroke="#3569A8" stroke-width="2.7" marker-end="url(#arrow-blue)"/>
  <text class="small" x="1038" y="440" text-anchor="middle" fill="#3569A8">环境交互后的 IMU / 关节 / 足端时序反馈</text>

  <line x1="64" y1="466" x2="1856" y2="466" stroke="#D9E2E8" stroke-width="1.5"/>
  <text class="section" x="64" y="506">B. 联合训练与工程验证：共享策略、风险监督、平滑切换</text>

  <!-- Training and engineering pathway -->
  <rect class="neutral-box" x="64" y="536" width="415" height="416" rx="16"/>
  <text class="box-title" x="86" y="574">多步态与地形联合课程</text>
  <text class="body" x="86" y="611">从现有稳定楼梯 / Trot 策略初始化</text>
  <rect x="84" y="631" width="375" height="82" rx="10" fill="#EAF2FA"/>
  <text class="small" x="100" y="658" font-weight="700" fill="#315F97">场景组合</text>
  <text class="small" x="100" y="682">平地、楼梯、粗糙地、局部湿滑斑块</text>
  <text class="small" x="100" y="703">干湿边界、坡面与速度变化</text>
  <rect x="84" y="728" width="375" height="194" rx="10" fill="#EFF8F6" stroke="#13877F" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text class="small" x="100" y="756" font-weight="700" fill="#0D706B">循序扩展，保留已掌握能力</text>
  <text class="body" x="100" y="789">① 固定 Trot / 楼梯基线并加入 e<tspan baseline-shift="sub" font-size="11">gait</tspan></text>
  <text class="body" x="100" y="822">② 分别训练慢走、台阶步态与湿滑步态</text>
  <text class="body" x="100" y="855">③ 混合采样步态切换和干湿交界</text>
  <text class="small" x="100" y="892">随机化局部 μ(x,y)、坡度与斑块位置</text>

  <rect class="neutral-box" x="523" y="536" width="415" height="416" rx="16"/>
  <text class="box-title" x="545" y="574">仿真特权监督与联合更新</text>
  <text class="body" x="545" y="611">滑移标签：contact ∧ ‖v<tspan baseline-shift="sub" font-size="11">foot,tan</tspan>‖ &gt; ε</text>
  <rect class="train-box" x="543" y="632" width="375" height="70" rx="10"/>
  <text class="formula" x="563" y="662">y<tspan baseline-shift="sub" font-size="12">slip</tspan>；gait id、支撑相 / 占空比</text>
  <text class="small" x="563" y="688" fill="#7B6341">μ、接触状态只作仿真监督标签</text>
  <text class="body" x="545" y="742">联合目标：</text>
  <text class="formula" x="545" y="773">L = L<tspan baseline-shift="sub" font-size="11">PPO</tspan> + λ<tspan baseline-shift="sub" font-size="11">s</tspan>L<tspan baseline-shift="sub" font-size="11">slip</tspan> + λ<tspan baseline-shift="sub" font-size="11">g</tspan>L<tspan baseline-shift="sub" font-size="11">gait</tspan></text>
  <text class="formula" x="545" y="802">+ λ<tspan baseline-shift="sub" font-size="11">tr</tspan>L<tspan baseline-shift="sub" font-size="11">transition</tspan> + L<tspan baseline-shift="sub" font-size="11">VAE</tspan></text>
  <line x1="545" y1="825" x2="916" y2="825" stroke="#D9E2E8" stroke-width="1.5"/>
  <text class="small" x="545" y="855">部署 Actor 不读取摩擦真值 / 仿真接触力</text>
  <text class="small" x="545" y="884">仍以本体时序观测估计风险和选择动作</text>

  <rect class="teal-box" x="982" y="536" width="415" height="416" rx="16"/>
  <text class="box-title" x="1004" y="574" fill="#0D706B">关键创新：风险—步态—速度耦合</text>
  <text class="body" x="1004" y="611" font-weight="700">1. 共享步态条件策略</text>
  <text class="small" x="1024" y="636">一套 Actor 接受 e<tspan baseline-shift="sub" font-size="10">gait</tspan>，统一表征多种步态</text>
  <text class="small" x="1024" y="658">避免独立策略硬切换，保留 12D 动作接口</text>
  <text class="body" x="1004" y="696" font-weight="700">2. 风险同时调速度与步态</text>
  <text class="small" x="1024" y="721">p<tspan baseline-shift="sub" font-size="10">slip</tspan>↑ → 限速 + 提高占空比 / 降低步频</text>
  <text class="small" x="1024" y="743">需要时 Trot → Walk/Crawl；安全后渐进恢复</text>
  <text class="body" x="1004" y="781" font-weight="700">3. 相位连续的抗抖切换</text>
  <text class="small" x="1024" y="806">风险阈值滞回 + 最小驻留时间</text>
  <text class="small" x="1024" y="828">在支撑相 / 周期边界渐变步态参数</text>
  <text class="small" x="1004" y="875">贡献：少摔倒、少打滑，同时兼顾效率与楼梯能力</text>
  <text class="tiny" x="1004" y="905" fill="#536B7C">建议以消融实验验证各模块增益，不预设结果</text>

  <rect class="neutral-box" x="1441" y="536" width="415" height="416" rx="16"/>
  <text class="box-title" x="1463" y="574">分级验证与工程验收</text>
  <text class="body" x="1463" y="611">MuJoCo → 受控湿地 → 户外限定路线</text>
  <text class="small" x="1463" y="641">路线：干地→湿滑→干湿边界→楼梯</text>
  <line x1="1463" y1="662" x2="1834" y2="662" stroke="#D9E2E8" stroke-width="1.5"/>
  <text class="body" x="1463" y="696" font-weight="700">消融对照</text>
  <text class="small" x="1463" y="724">现有基线 / 固定多步态 / 风险耦合切换</text>
  <text class="small" x="1463" y="751">任务成功率、跌倒率、滑移距离</text>
  <text class="small" x="1463" y="778">切换次数 / 延迟、恢复时间、单位距离能耗</text>
  <line x1="1463" y1="800" x2="1834" y2="800" stroke="#D9E2E8" stroke-width="1.5"/>
  <text class="body" x="1463" y="834" font-weight="700" fill="#0D706B">工程验收约束</text>
  <text class="small" x="1463" y="862">湿滑改善且干地、已掌握楼梯不退化</text>
  <text class="small" x="1463" y="890">真机先低速、保护架 / 安全绳、逐级加难</text>

  <path class="flow-gray" d="M 479 742 L 523 742"/>
  <path class="flow-gray" d="M 938 742 L 982 742"/>
  <path class="flow-gray" d="M 1397 742 L 1441 742"/>

  <line x1="64" y1="978" x2="1856" y2="978" stroke="#D9E2E8" stroke-width="1.5"/>
  <text class="tiny" x="66" y="1008" fill="#536B7C">Lite3 基线：12 DoF，action scale 0.25，Kp/Kd = 20/0.7，降采样 4；DreamWaQ Actor 输入 45 + 16 + 3 = 64D。</text>
  <text class="tiny" x="66" y="1034" fill="#536B7C">建议模块：步态条件输入、风险监督与相位连续切换；继承稳定楼梯策略，逐步扩展并回归测试干地 / 楼梯性能。</text>
  <text class="small" x="1854" y="1126" text-anchor="end" fill="#718391">Lite3 · 多步态与湿滑鲁棒行走技术路线</text>
</svg>
